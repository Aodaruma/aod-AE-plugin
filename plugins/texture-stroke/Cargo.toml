[package]
name = "texture_stroke"
description = "Generates textured strokes from mask and shape paths."
version = "0.5.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = []
catch-panics = []

[dependencies]
after-effects = { workspace = true }
utils = { path = "../../crates/utils" }
serde = { version = "1", features = ["derive"] }


[dev-dependencies]
pipl = { workspace = true }

[build-dependencies]
chrono.workspace = true
pipl.workspace = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[lints]
workspace = true
