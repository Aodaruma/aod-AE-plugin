# Template material: MPL-2.0 with the additional permission in TEMPLATE-LICENSE.txt.
[package]
name = "panorama_reframe"
description = "Reframes 360-degree panoramas with camera projections, quaternion rotation, and After Effects camera synchronization."
version = "0.1.4"
edition = "2024"
license.workspace = true
authors.workspace = true


[lib]
crate-type = ["cdylib"]

[features]
default = []
catch-panics = []

[dependencies]
after-effects = { workspace = true }
utils = { path = "../../crates/utils" }


[dev-dependencies]
pipl = { workspace = true }

[build-dependencies]
chrono.workspace = true
pipl.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
